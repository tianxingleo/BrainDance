# BrainDance CI — smoke-level checks for each sub-project
# 每个 job 独立运行，互不阻塞；均不做完整构建（build/apk/ipa），
# 只做静态分析与编译检查，确保基本语法 / 类型 / lint 通过。
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# 同一分支的多次 push 自动取消旧的 workflow run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ──────────────────────────────────────────────
# Job 1: Flutter 静态分析 + 单元测试
# ──────────────────────────────────────────────
jobs:
  flutter-check:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # pubspec.yaml 中 environment.sdk: ^3.10.7
          # flutter-action 会自动选择 channel 中满足约束的最新版本
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # ── smoke-level: 静态分析，不做 build ──
      - name: Analyze (smoke)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # ── smoke-level: 运行已有单元测试 ──
      - name: Test (smoke)
        run: flutter test

  # ──────────────────────────────────────────────
  # Job 2: Dashboard (Vue + TypeScript)
  # ──────────────────────────────────────────────
  dashboard-check:
    name: Dashboard Type-Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      # ── smoke-level: vue-tsc 类型检查 + vite 生产构建 ──
      #   package.json "build": "vue-tsc -b && vite build"
      #   build 脚本已包含 vue-tsc 类型检查，无需单独跑 lint
      - name: Build (smoke — includes vue-tsc type-check)
        run: npm run build

  # ──────────────────────────────────────────────
  # Job 3: Supabase Edge Functions (Deno TS)
  # ──────────────────────────────────────────────
  supabase-check:
    name: Supabase Edge Functions Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # ── smoke-level: 对 supabase/functions 下所有 .ts 做类型检查 ──
      #   --noCheck  ：只做语法与模块解析，不做远程 URL 的类型下载
      #   Edge Functions 使用 Deno 风格的 URL import (deno.land/std@0.168.0)
      #   不传 --noCheck 时 deno check 会拉取远程类型，可能较慢但更严格
      - name: Deno check all functions (smoke)
        run: |
          shopt -s globstar nullglob
          failed=0
          for f in supabase/functions/**/*.ts; do
            echo "::group::check $f"
            if ! deno check --no-lock "$f"; then
              echo "::warning::deno check failed for $f"
              failed=1
            fi
            echo "::endgroup::"
          done
          if [ "$failed" -eq 1 ]; then
            echo "::warning::Some Supabase function checks failed (see above)"
          fi

  # ──────────────────────────────────────────────
  # Job 4: Python (ai_engine) compileall
  # ──────────────────────────────────────────────
  python-check:
    name: Python Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要 submodule 内容来做完整检查；
          # 但 ai_engine/3dgs/src/libs/ 下有 7 个重型子模块(CUDA/nerfstudio 等)，
          # 这里选择不递归拉取子模块，避免下载大量无关依赖。
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── smoke-level: 只检查 Python 语法是否可编译 ──
      #   不安装任何第三方依赖，不做 import 解析，不做运行测试。
      #   compileall 会跳过语法错误的文件并返回非零退出码。
      #   排除 ai_engine/3dgs/src/libs/ 子模块目录（未拉取，内容为空或不完整）。
      - name: Compileall check (smoke — syntax only)
        run: |
          python -m compileall -q \
            -x 'ai_engine/3dgs/src/libs' \
            ai_engine/ \
            || { echo "::warning::Some Python files have syntax errors"; exit 1; }
